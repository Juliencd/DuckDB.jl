name: Julia

# CI for the DuckDB.jl package: JuliaFormatter, the package test suite (against
# DuckDB_jll, so no libduckdb build is needed), and the Python codegen adapter
# tests (capigen from PyPI, generates src/api.jl and src/ctypes_generated.jl).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: julia-${{ github.ref }}
  cancel-in-progress: true

jobs:
  julia:
    name: julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported (Project.toml compat) and current release.
        version: ['1.10', '1.13.3']
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      # Format first: a fresh checkout is clean, which format_check.sh requires.
      - name: Format check
        if: matrix.version == '1.10'
        run: |
          julia -e 'import Pkg; Pkg.add("JuliaFormatter")'
          ./format_check.sh
      - name: Test (DuckDB_jll)
        env:
          JULIA_NUM_THREADS: '2'
        run: julia --project -e 'import Pkg; Pkg.test()'

  codegen-adapter-test:
    name: codegen adapter test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Provision codegen env
        run: uv sync --group dev
      - name: Test the Julia adapter
        run: uv run --group dev pytest scripts -q
